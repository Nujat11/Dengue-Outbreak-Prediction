# Netlify configuration file for Dengue Outbreak Prediction

[build]
  # The directory where Netlify will run npm install and npm run build
  base = "frontend"

  # The command Netlify runs to build the project
  command = "npm run build"

  # The directory Netlify will publish (relative to the base directory)
  publish = "dist"

# Handles React Single Page Application (SPA) routing redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
