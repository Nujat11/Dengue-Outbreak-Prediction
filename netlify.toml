# Netlify configuration file for Dengue Outbreak Prediction

[build]
  # Build from the root by going into the frontend folder, installing, and building
  command = "cd frontend && npm install && npm run build"

  # Publish the dist folder inside the frontend subdirectory
  publish = "frontend/dist"

# Handles React Single Page Application (SPA) routing redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
